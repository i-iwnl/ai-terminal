  - id: S57
    title: 分割中だけペインヘッダが出て、最初の行を隠さずに種別と cwd を示す
    spec: S57-pane-header.spec.ts
    readme: false
    note: >-
      design-review.md「3. 改訂した導入計画」PR 5 行（アクティブ表現 + ペイン
      ヘッダ + aria 名）の関門を実測で固定する。1ペインではヘッダを出さない
      こと、分割中は zsh/claude 等の種別 + cwd の basename を出すこと、
      ヘッダの下端が最初の行の上端と重ならないこと（初期実装は
      `position: absolute` の重ね描きで、行数は変わらないまま最初の行の
      約93%が隠れていた。レビューで通常フローに入れる実装へ修正した。
      `pty:resize` の発火回数を実測すると重ね描き版・フロー版のどちらも
      2回で変わらず、design-review が懸念した「幾何の分岐」による余計な
      SIGWINCH には当たらないことを確認済み）、木のルートでない leaf が
      role="tabpanel" を名乗らず role="group" + aria-label になること
      （PR 4 の1タブ=1tabpanel契約と矛盾しないこと）を見る。

