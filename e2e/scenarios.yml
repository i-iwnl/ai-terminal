      キャンセルしたあと、同じ Cmd+W で今度はちゃんとタブが閉じることを
      同じテスト内で確認する。これは isEditableTarget（lib/shortcuts.ts）の
      素通しが効きすぎておらず、編集中でなくなれば通常どおりショートカットが
      機能することの担保（1 spec = 1 test の制約上、前半だけでは
      「全ショートカットを殺す実装」を誤って通してしまう）

  # --- タスク一覧のキーボード到達性（Issue #64） ------------------------------
  - id: S47
    title: キーボードだけでタスク一覧の押せる行に到達し、対応するタブにフォーカスが移る
    spec: S47-task-row-keyboard.spec.ts
    readme: false
    note: >-
      タスク一覧の行が `<li onClick>` のままで tabindex も role も無く、
      キーボードだけでは実行中セッションのタブへ飛べなかった（WCAG 2.1.1
      違反）。修正は `<li>` を保ったまま、押せる行だけを内側の `<button>` に
      する（押せない行は非対話のまま据え置く）。
      押せる行になる条件（ownedByApp && canFocus）を満たすため、agents.json
      の固定 sessionId と同じ ID を持つ履歴フィクスチャをこの spec だけの
      一時 HOME に追記し、それを resume することで markOwnedSession に
      同じ ID を登録させる（S15 が「固定フィクスチャでは positive case を
      作れない」とした制約を、resume 経由で回避する）。
      Tab キーだけで押せる行の <button> に到達できること、Enter で
      対応するタブがアクティブになり実際に xterm の隠し textarea まで
      フォーカスが移ることを見る。押せない行（other-project-idle）が
      依然として <div> のまま非対話であることも合わせて確認する。

  # --- ランドマークと live region（Issue #56 PR 0-c） --------------------------
  - id: S48
    title: サイドバーが nav、ターミナル領域が main のランドマークとして存在し、status live region がちょうど1個ある
    spec: S48-landmarks.spec.ts
    readme: false
    note: >-
      Issue #56（分割表示）の前提工事。分割そのものは1行も入らない。
      ランドマークが無いままだと、ペインが増えたときに構造の手がかりが
      さらに埋もれる。Sidebar.tsx の <aside> を <nav aria-label="サイドバー">
      に、App.tsx の .main を <main> にし、.app 直下に role="status" の
      live region をちょうど1個だけ置いた（PTY 終了の告知に紐づけてある。
      更新されない空の live region は ARIA の嘘になるため）。
      計画書は「現状ランドマークは0件」としていたが、実際には <aside>
      （暗黙の role="complementary"）が初期コミットから存在していた。
      xterm 内部の .xterm-accessibility（S37 が「露出1個」を固定している
      aria-live="assertive"）とは別系統で、こちらは暗黙 polite なので
      assertive の読み上げを割り込んで中断しない。
      aria-label とランドマークの role を読むだけなので、PTY の出力や
      タイミングに依存せず安定する。

  # --- タブとサイドバー行のキーボード到達性（Issue #20 PR 9） -----------------
  - id: S51
    title: タブに Tab キーで到達でき、矢印キーで roving tabindex が機能する
    spec: S51-tab-roving-tabindex.spec.ts
    readme: false
    note: >-
      タブが `<div onClick>` のままで role も tabindex も無く、Tab キーでは
      到達できなかった。role="tablist" / role="tab" と roving tabindex を
      実装した。レビューで2件の不具合が出た。
      1件目は、閉じるボタンに tabIndex を明示しておらず既定値 0 のままで、
      Tab の停止点が「1 + タブ枚数」になっていたこと。tabIndex={-1} で
      修正し、能力を減らさないよう role="tab" にフォーカスした状態の
      Delete / Backspace でそのタブを閉じる経路（WAI-ARIA APG 推奨）を
      足した。
      2件目は、矢印キーで「移動 = 選択」にする automatic activation では、
      選択が変わるたびに TerminalPane.tsx の既存の仕組みがフォーカスを
      端末へ奪い、xterm が Tab を自前で処理するせいでタブリストへ戻れず、
      矢印キーでの移動が実質1ホップに制限されていたこと。APG が
      「activate でフォーカスが移る場合は manual activation」と定めている
      とおり、矢印キーはフォーカスだけを動かし選択は Enter / Space で
      切り替える方式に変更した。
      本 spec は、閉じるボタンが停止点にならないこと、矢印キーを2回以上
      連続で押して選択を変えずに移動し続けられること（ここが本題）、
      Enter と Space の両方で初めて選択が切り替わること、Delete と
      Backspace でキーボードだけでタブを閉じられること、そして
      role="tab" の aria-controls が指す先に実在する role="tabpanel" が
      あり逆向きの aria-labelledby も対になっていること（属性の有無だけを
      見るとリンク切れを緑のまま見逃すため）を検証する。

  - id: S52
    title: キーボードだけで履歴一覧の resume・メモ・編集ボタンに到達できる
    spec: S52-history-row-keyboard.spec.ts
    readme: false
    note: >-
      履歴一覧の行が `<li onClick>` のままで resume していた。#64 / PR #80
      （TaskList.tsx）の流儀に合わせ `<li>` を保ったまま resume 部分だけを
      <button> にするが、同じ行に「メモ」「編集」という別のインタラクティブ
      要素があるため、<button> の入れ子にはできず兄弟にする必要がある
      （<button> は対話的な内容を含められない）。
      Tab だけで resume ボタン・メモ・編集の3つに独立して到達でき
      （入れ子による崩れが無いことの証明）、Enter で実際に resume が
      走ることを見る。

  - id: S53
    title: キーボードだけでメモ一覧の行に到達し、Enter でメモが開く
    spec: S53-memo-row-keyboard.spec.ts
    readme: false
    note: >-
      セッションメモ一覧の行が `<li onClick>` のままだった。他の
      インタラクティブ要素が無いため行全体を1つの <button> にできる
      （TaskList.tsx のような div / button の分岐は不要）。
      S30 と同じ手順でメモを1件作成したあと、Tab だけで一覧の行に到達し、
      Enter で該当セッションのメモが読み込まれることを見る。

  - id: S54
    title: タブが10枚を超えてもキーボードだけで最後のタブへ到達できる
    spec: S54-tab-reach-beyond-nine.spec.ts
    readme: false
    note: >-
      Issue #65 の再発防止。タブの切り替えは長らく Cmd+1〜Cmd+9 しか無く、
      10枚目以降のタブにはキーボードから到達できなかった。Issue #20 の PR 9
      （PR #86）で入れた role="tablist" + roving tabindex がこれを解消している。
      S51 は3枚での roving tabindex の挙動そのものを見るが、枚数が増えて
      タブバーが横スクロールに入ったときにフォーカスした要素が画面外へ
      出たままにならないかは見ていない。ここはコード読解では潰せないため、
      実際に12枚開いて End と ArrowLeft で10〜12枚目へ到達し、
      toBeInViewport() と Enter による切り替えまで確認する。

  # --- 通知バナー（Issue #20 PR 11） -----------------------------------------
  - id: S55
    title: 通知が複数同時に出ても、それぞれ独立に閉じられ、severityが色以外の手がかりでも区別できる
    spec: S55-notice-severity.spec.ts
    readme: false
    note: >-
      通知バナーが `useState<string | null>` の単一文字列で、後から来た通知が
      前の通知を黙って消し、severity（情報/エラー）の区別も無かった。配列 +
      severity（lib/notices.ts の pushNotice / dismissNotice / severityForExit）
      に置き換え、右上へ移した。
      この harness で通知バナーを実際のユーザー操作から再現できる経路は
      PTY の終了だけ（S11 のとおり spawn 失敗は非同期にしか失敗せず
      showError 経路を同期的には再現できない）なので、正常終了（コード0、
      情報）と異常終了（0以外、エラー）を実際に起こし分けて両方を検証する。
      severity は色だけで表さず、アイコンの字形（i / !）と語（情報/エラー）
      が独立に同じ情報を運ぶことも見る。
      通知1件ごとに role="alert" を付けると複数件が同時に現れたとき
      assertive な live region 同士が読み上げを潰し合うため、入れ物1個
      だけを live region にし、エラーが1件でもあれば alert、無ければ
      status に出し分けている。S37（xterm の assertive live region が
      常に1個）・S48（.app-status の role="status" が常に1個）を
      壊していないことも合わせて固定する。
      **Issue #136（#160 の周1）で、ペイン内の終了行
      `[プロセスは終了しました（コード N）]` の assert を足した。**
      `useTerminal.ts` がそのペインのスクロールバックへ書くこの行は、
      **現状ただ1つの「ペイン単位で消えない終了表示」**（タブバーのバッジは
      アクティブな leaf しか見ておらず、通知バナーは消え、Dock バッジは
      exit を数えない）なのに、リポジトリ全体で assert が0本だった。
      この spec が既にコード0とコード7の**両方**を打っているため、
      追加のセットアップ無しで `label` のコード側2ケースを押さえられる
      （シグナル側は harness から起こせない）。通知を全部閉じたあとに
      置いてあるのは、「バナーは消えるがこの行は消えない」という主張
      そのものを同じ流れの中で示すため。

