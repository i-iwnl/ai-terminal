  - id: S61
    title: Cmd+] / Cmd+[ と Cmd+Option+矢印 でペイン間をフォーカス移動できる
    spec: S61-pane-navigation.spec.ts
    readme: false
    note: >-
      design-review.md 提案 B'（ペイン間移動）の配線を実測で固定する。
      `nextPane` / `previousPane` / `movePaneInDirection`（tabs/paneTree.ts）
      は既に test/unit/pane-tree.test.ts が網羅的に固定済みの純粋関数のため、
      ここではアルゴリズムを再検証せず、実際のキー入力（`Cmd+]` / `Cmd+[` /
      `Cmd+Option+矢印`）でアプリの `.terminal-pane.is-active` が実際に動く
      ことだけを見る。`Cmd+Option+矢印` は U1（design-review.md）でガードが
      緩んだことに依存する変更で、実際にこのキーで動作が変わることを
      確認できるのはこの E2E だけ（unit はガードの真偽値だけを固定している）。
  - id: S62
    title: 2つ以上のPTYを一度に閉じるときはタブバーのxボタンでも確認が入り、結果がrole=statusで告知される
    spec: S62-close-confirmation.spec.ts
    readme: false
    note: >-
      design-review.md「提案 E'（改訂）: 閉じる」の関門を実測で固定する。
      2つ以上の PTY を一度に閉じるとき（タブバーの x ボタン。`Cmd+Shift+W` を
      新設していないためマウス経由の唯一の抜け穴）だけ確認ダイアログが出て、
      文言が「走行中のプロセス N 件を終了します」（何が失われるかの語）で
      あること、x ボタンの `title`/`aria-label` に事前にペイン数が出ること、
      Escape でキャンセルできること、結果が role="status"（.app-status）で
      告知されること（Cmd+W がペインを閉じたのかタブごと閉じたのかを視覚
      以外で区別する手段が無かった問題への対処）を見る。Cmd+W
      （closeActivePane）は常に1本しか PTY を巻き込まないため対象外
      （S56 が既に固定済み）。
  - id: S63
    title: 対象ペインが同じタブの非アクティブ側にあっても通知クリックでそのペインへフォーカスが移り、既にアクティブなら別の手がかりが出る
    spec: S63-task-pane-focus.spec.ts
    readme: false
    note: >-
      design-review.md U4（5人全員が独立に指摘した前提の誤りの4件目）の
      修正を実測で固定する。「タブを前に出す」だけでは、対象ペインが今の
      タブに既に見えている場合 no-op になり通知をクリックしても画面が
      1pxも動かず壊れて見える。履歴の resume（固定 UUID
      11111111-1111-4111-8111-111111111111、S19 と同じ）でセッションを
      開いたタブを分割し、そのタブが既にアクティブなまま
      `session:focus`（OS 通知クリックの経路）を直接送って、非アクティブ
      側のペインへ実際にフォーカスが移ることを見る。タスク一覧の行クリック
      ではなくこの経路で検証する理由は、偽 CLI の agents.json がアプリの
      実セッションと独立しており owned なタスク行を再現できないため
      （S15 が既に記録済みの制限）。タスク一覧の行クリックと OS 通知は
      どちらも App.tsx の同じ `focusPaneLocation` を通るため、この経路の
      検証で両方をカバーする。**最重要**: 対象ペインが既にアクティブな
      状態でもう一度同じ通知を送ると、画面は変わらないが通知バナー +
      role="status" で「既に表示されています」という手がかりが出ること
      （「何も起きない」で終わらせないという要件そのもの）。

