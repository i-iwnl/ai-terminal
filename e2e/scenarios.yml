  - id: S63
    title: 対象ペインが同じタブの非アクティブ側にあっても通知クリックでそのペインへフォーカスが移り、既にアクティブなら別の手がかりが出る
    spec: S63-task-pane-focus.spec.ts
    readme: false
    note: >-
      design-review.md U4（5人全員が独立に指摘した前提の誤りの4件目）の
      修正を実測で固定する。「タブを前に出す」だけでは、対象ペインが今の
      タブに既に見えている場合 no-op になり通知をクリックしても画面が
      1pxも動かず壊れて見える。履歴の resume（固定 UUID
      11111111-1111-4111-8111-111111111111、S19 と同じ）でセッションを
      開いたタブを分割し、そのタブが既にアクティブなまま
      `session:focus`（OS 通知クリックの経路）を直接送って、非アクティブ
      側のペインへ実際にフォーカスが移ることを見る。タスク一覧の行クリック
      ではなくこの経路で検証する理由は、偽 CLI の agents.json がアプリの
      実セッションと独立しており owned なタスク行を再現できないため
      （S15 が既に記録済みの制限）。タスク一覧の行クリックと OS 通知は
      どちらも App.tsx の同じ `focusPaneLocation` を通るため、この経路の
      検証で両方をカバーする。**最重要**: 対象ペインが既にアクティブな
      状態でもう一度同じ通知を送ると、画面は変わらないが通知バナー +
      role="status" で「既に表示されています」という手がかりが出ること
      （「何も起きない」で終わらせないという要件そのもの）。
      Issue #120 C-2（周4）で、**対応するペインが1つも無い場合**も同じ形で
      手当てしたことを足した。通知は claude agents --json のポーリングから作られ
      ownedByApp で絞っていない（scopeAgentsToCwd の既定は false = マシン全体）ため、
      他のターミナルで起動した claude の完了通知が既定で飛ぶ。押しても対応する
      leaf が無く、以前は黙って抜けてウィンドウが前に出るだけだった。
      同じ空振りは tmux 永続化でタブだけ閉じた場合やアプリ再起動後にも起きる。
      アプリが一度も起動していない UUID を session:focus で送り、通知バナーと
      role="status" の両方に文言が出ること、かつ**タブもペインも動かないこと**
      （見つからないのに何か起きたように見せると嘘になる）を見る。

