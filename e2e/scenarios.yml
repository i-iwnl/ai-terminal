# E2E テストシナリオの唯一の正。
#
# ここに書いたシナリオと e2e/specs/ のファイルは 1:1 でなければならない。
# 突合は `make e2e-lint`（scripts/lint-e2e.mjs）が機械検査する。
#
# - id: S<番号>。spec のファイル名の接頭辞と一致させる
# - title: test() のタイトルに必ず含める（lint が検査する）
# - spec: e2e/specs/ からの相対パス
# - screenshot: README の使い方ガイドに載せる画像名（不要なら省略）
# - readme: true のものが README の使い方ガイドに掲載される

scenarios:
  # --- 起動と描画 -----------------------------------------------------------
  - id: S01
    title: アプリが起動し、サイドバーとターミナルが表示される
    spec: S01-launch.spec.ts
    screenshot: S01-launch.png
    readme: true
  - id: S02
    title: シェルが起動してプロンプトが表示される
    spec: S02-shell-prompt.spec.ts
    readme: false
    note: >-
      preload の読み込み失敗を検出する。実際にこの不具合を作り込んだことがある。
      あわせて Issue #61 の再発防止として、TERM_PROGRAM=Apple_Terminal を明示的に
      継承させても「Restored session: ...」という嘘の行が出ないことを見る
      （harness.ts の simulateAppleTerminalHost で確実に再現条件を揃える。
      指定しないと実行者のターミナルアプリ依存になり、退行しても検出できない
      green になりうる）
  - id: S03
    title: コマンドを入力すると出力が返る
    spec: S03-shell-echo.spec.ts
    screenshot: S03-shell-echo.png
    readme: true
  - id: S04
    title: 日本語と絵文字を含む出力で文字幅がずれない
    spec: S04-wide-chars.spec.ts
    screenshot: S04-wide-chars.png
    readme: true
  - id: S05
    title: 色付き出力が反映される
    spec: S05-ansi-color.spec.ts
    readme: false

  # --- タブ -----------------------------------------------------------------
  - id: S06
    title: 新しいシェルタブを開ける
    spec: S06-new-tab.spec.ts
    screenshot: S06-new-tab.png
    readme: true
  - id: S07
    title: タブを切り替えても各タブの内容が保持される
    spec: S07-tab-switch.spec.ts
    readme: false
    note: Terminal インスタンスを破棄せず表示切替で扱っていることの担保
  - id: S08
    title: タブを閉じられ、最後の1枚を閉じると新しいシェルが開く
    spec: S08-close-tab.spec.ts
    readme: false

  # --- AI CLI 連携 ----------------------------------------------------------
  - id: S09
    title: claude を起動すると session-id が渡る
    spec: S09-launch-claude.spec.ts
    screenshot: S09-launch-claude.png
    readme: true
  - id: S10
    title: gemini を起動できる
    spec: S10-launch-gemini.spec.ts
    readme: false
  - id: S11
    title: CLI が見つからないときに日本語のエラーが表示され、アプリが落ちない
    spec: S11-cli-missing.spec.ts
    screenshot: S11-cli-missing.png
    readme: true

  # --- サイドバー（実行中タスク一覧） ---------------------------------------
  - id: S12
    title: 実行中タスクが一覧に表示され、状態で区別される
    spec: S12-task-list.spec.ts
    screenshot: S12-task-list.png
    readme: true
  - id: S13
    title: 実行中タスクが0件のとき空状態が表示される
    spec: S13-task-empty.spec.ts
    readme: false
  - id: S14
    title: タスク一覧の取得に失敗してもエラー表示になり画面が壊れない
    spec: S14-task-error.spec.ts
    readme: false
  - id: S15
    title: このアプリが起動したタスクが視覚的に区別される
    spec: S15-task-owned.spec.ts
    readme: false

  # --- 履歴 / resume --------------------------------------------------------
  - id: S16
    title: 履歴が更新時刻の降順で表示される
    spec: S16-history-order.spec.ts
    screenshot: S16-history-order.png
    readme: true
  - id: S17
    title: タイトルが無い履歴は最初のプロンプトで表示される
    spec: S17-history-fallback.spec.ts
    readme: false
  - id: S18
    title: 壊れた履歴も縮退表示され、一覧から消えない
    spec: S18-history-broken.spec.ts
    screenshot: S18-history-broken.png
    readme: true
    note: 外部フォーマットが壊れうる前提の防御的パースの本丸
  - id: S19
    title: 履歴をクリックすると resume 付きでタブが開く
    spec: S19-history-resume.spec.ts
    screenshot: S19-history-resume.png
    readme: true
    note: >-
      resume 付きでの起動に加え、再開で開いたタブのタイトルが履歴一覧でクリックした
      行の表示タイトルと一致することも検証する。固有名には依存させず、クリック前に
      読んだ .history-item__title のテキストと再開後の .tab-bar__title を比較する
      性質ベースの検証にしてある

  # --- その他 ---------------------------------------------------------------
  - id: S20
    title: 検索 UI を開ける
    spec: S20-search.spec.ts
    readme: false
  - id: S21
    title: 設定のフォントサイズとテーマが反映される
    spec: S21-config.spec.ts
    readme: false

  # --- 日本語入力 -----------------------------------------------------------
  - id: S22
    title: IME の変換中テキストが表示され、確定するとシェルに渡る
    spec: S22-ime-composition.spec.ts
    screenshot: S22-ime-composition.png
    readme: true
    note: >-
      Chromium の DevTools Protocol の Input.imeSetComposition で変換中の状態を作る。
      担保できるのは xterm.js 側の composition 処理までで、macOS の入力メソッドとの
      実際の相互作用は再現していない。OS レベルの確認は手動チェックリストに残す

  # --- 描画（WebGL レンダラ） -----------------------------------------------
  - id: S23
    title: GPU 有効時に WebGL レンダラで実際に描画される
    spec: S23-webgl-rendering.spec.ts
    readme: false
    note: >-
      他の全シナリオは --disable-gpu で起動するため DOM レンダラ経路しか通らない。
      DOM レンダラは文字を実 DOM のテキストノードとして描くので、xterm.css の
      読み込みを忘れていても表示されてしまい、実際にその不具合を全22シナリオ green の
      まま見逃した。このシナリオだけ GPU を有効にし、canvas のピクセルを直接数えて
      「本当に描画されているか」を検証する

  # --- TUI とマウス ---------------------------------------------------------
  - id: S24
    title: 全画面 TUI が描画され、終了するとプロンプトに戻る
    spec: S24-fullscreen-tui.spec.ts
    readme: false
    note: >-
      代替画面（alternate screen）の出入りを検証する。題材は vim。htop ではなく
      macOS に標準で入っている vim を使うのは、隔離ハーネスの PATH を
      /usr/bin:/bin:/usr/sbin:/sbin に絞っており、brew で入れたコマンドに
      依存させたくないため。確かめたいのは特定のコマンドではなく
      「全画面を書き換える TUI が崩れず、抜けたらプロンプトに戻る」こと
  - id: S25
    title: マウスでテキストを選択してコピーできる
    spec: S25-mouse-selection.spec.ts
    readme: false
    note: >-
      マウス操作はこれまでどのシナリオでも触れていなかった。選択範囲は
      DOM から読みにくいので、選択したうえで Cmd+C し、Electron の
      clipboard に文字列が入ることで判定する。事前に番兵を書き込んでおき、
      前の実行の残りで誤って緑にならないようにする
  - id: S26
    title: タブタイトルをダブルクリックで編集できる
    spec: S26-rename-tab.spec.ts
    readme: false
    note: >-
      ダブルクリックで input が出て確定・Escape でのキャンセル・空白のみ入力時に
      元のタイトルが維持されることを検証する。編集後のタイトル文字列は自分で
      設定した固有の値との一致で確認し、キャンセル・空白入力時は
      「編集前と変わらない」という性質で確認する

  # --- 履歴タイトル編集 -------------------------------------------------------
  - id: S27
    title: 履歴のタイトルをインライン編集できる
    spec: S27-rename-history.spec.ts
    readme: false
    note: >-
      claude 側の履歴一覧で、編集ボタンのクリックで input が出て Enter で確定・
      Escape でキャンセルできることを検証する。行の並び順は mtime 降順で
      タイトル変更後も変わらないため、行の特定は本文一致ではなく並び順（nth）で
      行う。ツールバーの「更新」で再取得しても上書きタイトルが維持されること、
      編集ボタンのクリックおよび編集中の行のクリックが resume に波及しないことも
      合わせて検証する
  - id: S28
    title: gemini の履歴もタイトル編集が更新後も維持される
    spec: S28-rename-history-gemini.spec.ts
    readme: false
    note: >-
      gemini は保存キーに --list-sessions 行末の内部 UUID（stableId）を使う点が
      claude と異なるため、同じ編集 UI が gemini 側でも機能し、ツールバーの
      「更新」を挟んでも上書きタイトルが維持されることを別シナリオとして担保する

  # --- メモ -------------------------------------------------------------------
  - id: S29
    title: 全体メモを書くと保存され、開き直しても残る
    spec: S29-memo-global.spec.ts
    readme: false
    note: >-
      「入力欄に文字が入った」だけでは React の state に入っただけで緑になる。
      サイドバーのタブを切り替えて MemoPanel をアンマウントさせ、再マウント時の
      memo:list で取り直した値を見ることで IPC 越しの往復まで担保する。
      本文を空にするとメモが削除されることも合わせて確認する
  - id: S30
    title: 履歴からセッションメモを開いて書ける
    spec: S30-memo-session.spec.ts
    readme: false
    note: >-
      履歴一覧の「メモ」ボタンからメモタブへ遷移し、書いた内容が
      「どのセッションのメモか」分かる形で一覧に残ることを見る。行の特定は
      並び順（nth）で行い、セッション名は固有名ではなく「履歴一覧に出ていた
      表示名と一致する」という性質で確認する。ボタンのクリックが resume に
      波及しないことも合わせて検証する（行全体の onClick に飲まれやすい）
  - id: S33
    title: 自動保存が焼ける前に終了してもメモが失われない
    spec: S33-memo-flush-on-quit.spec.ts
    readme: false
    note: >-
      S29 はタブ切り替え（= blur）を経由するため、保留中のデバウンスではなく
      blur 時の即時保存が効いており、終了経路は通っていない。ここは blur を
      起こさずに入力し、800ms を待たずにウィンドウを閉じて、一時 HOME の
      memos.json をファイルとして直接読む。アプリを開き直して確かめる形にすると
      「保存されたか」ではなく「再起動後に読めるか」を見ることになる

  # --- タスク一覧の絞り込み ---------------------------------------------------
  - id: S34
    title: 現在のディレクトリで絞り込むと、無関係なタスクが一覧から消える
    spec: S34-task-scope-cwd.spec.ts
    readme: false
    note: >-
      config.scopeAgentsToCwd を有効にして起動する経路。件数だけでなく、どちらが
      残ったかまで確認する（逆向きに壊れても件数は 1 になりうる）。絞り込まない
      場合に2件出ることは S12 が担保しているので、ここでは重ねない。この設定は
      Renderer が agents:list に cwd を添えて初めて効くが、実際には空の引数で
      呼んでおり一度も効いていなかった
  - id: S35
    title: 設定パネルで絞り込みを切り替えると、次のポーリングで反映される
    spec: S35-task-scope-toggle.spec.ts
    readme: false
    note: >-
      S34 は config.json に書かれた状態で起動するが、こちらはアプリを起動したまま
      画面から変える経路（ユーザーが実際に使うのはこちら）。有効 -> 無効まで往復
      させる。片道だけだと、絞り込みが効いたまま戻らない不具合を緑で通す。
      チェックボックスは config:set の往復後に再描画されるため check() は使えない

  # --- 設定と通知 -------------------------------------------------------------
  - id: S38
    title: Dock バッジにあなたの番の件数が出る
    spec: S38-dock-badge.spec.ts
    readme: false
    note: >-
      Dock バッジは Renderer から見えないので、electronApp.evaluate() で
      app.getBadgeCount() を読む。フィクスチャは busy 1件 + idle 1件なので期待値は 1。
      「0 より大きい」ではなく **総数（2）ではないこと** を見るのが要点で、
      緩い判定にすると busy 側を数える逆の実装でも緑になる

  - id: S37
    title: 設定でターミナルをスクリーンリーダーから読めるようにできる
    spec: S37-screen-reader-mode.spec.ts
    readme: false
    note: >-
      ターミナルは WebGL レンダラが canvas に描くため、既定では DOM にテキストが
      1文字も無い（= VoiceOver から主コンテンツが不在）。xterm の screenReaderMode を
      有効にすると読み上げ用の要素が生える。既定（無効）と有効の両方を見ないと
      「常に出ている / 常に出ていない」と区別が付かないため、1つのシナリオの中で
      2回起動して比較する。実際に読み上げられるかは OS の支援技術が要るので対象外。
      あわせて、タブが複数あっても .xterm-accessibility はちょうど1個であることも
      見る（issue-56 PR 0-a）。xterm は screenReaderMode 有効時に
      aria-live="assertive" の live region を生やし、assertive は読み上げを
      割り込んで中断するため、2個以上が同時に露出すると片方の読み上げがもう片方に
      潰される。今日は非アクティブなタブの visibility: hidden がこれを偶然1個に
      抑えているが、Issue #56（分割表示）で同一タブ内の複数ペインが同時に visible に
      なるとこの遮断が効かなくなるため、App.tsx は screenReaderMode をアクティブな
      タブにだけ渡すようにしてある。その回帰を検出する不変条件として固定した

  - id: S36
    title: アプリケーションメニューが定義され、再読み込みが含まれない
    spec: S36-application-menu.spec.ts
    readme: false
    note: >-
      ネイティブメニューは Renderer から見えないため、electronApp.evaluate() で
      Main プロセス側の Menu を直接読む。既定メニューのままだと View > Reload
      （Cmd+R）が生き、押すと全タブの xterm とスクロールバックが消える（PTY は
      Main で生きているので表示だけが失われる）。あわせて、メニューの accelerator が
      二重発火（メニューと matchShortcut の両方が同じキーを登録している状態）は
      Playwright の合成キーがネイティブメニューを通らないため検出できない。
      そちらは実機での手動確認に依存する（issue-22/known-issues.md）

  - id: S31
    title: 設定パネルから変更するとターミナルに反映される
    spec: S31-settings-panel.spec.ts
    screenshot: S31-settings-panel.png
    readme: true
    note: >-
      S21 は config.json を先に書いた状態で起動して反映を見るが、こちらは
      アプリを起動したまま画面から変えて反映されるかを見る（config:set の往復と
      再描画が対象）。開閉は 設定ボタン / Cmd+, / Escape / 背景クリックの4経路
  - id: S32
    title: 設定した Webhook にテスト送信が届く
    spec: S32-webhook-notify.spec.ts
    readme: false
    note: >-
      「送信しました」の表示だけでは、Main が何も送らずに ok を返していても
      緑になる。ローカルに HTTP サーバを立て、実際にリクエストが届き本文が
      Slack は text / Discord は content の形になっていることまで確認する。
      到達不能な URL では失敗が表示されることも見て、成功と区別が付くことを担保する
  - id: S39
    title: CLI が起動時の PATH に無くても、ログインシェルから解決して一覧が出る
    spec: S39-path-via-login-shell.spec.ts
    readme: false
    note: >-
      Finder / Dock 起動のパッケージ版は launchd の最小 PATH しか継承せず、
      アプリが起動時にログインシェル（$SHELL -i -l）から PATH を補完して
      初めて CLI が見つかる（src/main/shell-path.ts、Issue #40）。
      通常のシナリオは偽 CLI を PATH の先頭に置くため、この補完が完全に
      壊れていても全部 green になる（実際に #40 はそうやってすり抜けた）。
      本シナリオだけは偽 CLI を .zshrc 経由でのみ露出し、解決の成否が
      そのまま一覧の表示に現れるようにする
  - id: S40
    title: 画面のコントラスト比が、記録した値から動いていない
    spec: S40-contrast-contract.spec.ts
    readme: false
    note: >-
      配色の値を変える作業（Issue #20 の Phase 1）に、良し悪しを判定する関門が
      無かった。他の spec は色をほとんど見ておらず、--text-tertiary を #000000 に
      しても全部 green になる。docs/images は存在しか検査されない。
      そのうえ手で書いたコントラストの表は2周続けて誤った（A-3 と、それを
      引き写した PR 5 の初版。どちらも「現状」の欄に別の面の値が紛れていた）。
      本シナリオは実際に描かれている色から比を測り、数値そのものを固定する
      characterization テスト。期待値は「あるべき値」ではなく「いまそうなっている値」で、
      多くは WCAG を満たしていない。値を変える PR では、この期待値の diff に
      変化が現れる（12枚の PNG を目で見るより精度が高い）
  - id: S41
    title: コントラストを上げる設定に追従して、弱い色が強くなる
    spec: S41-prefers-contrast.spec.ts
    readme: false
    note: >-
      macOS の「コントラストを上げる」への追従（styles.css の
      @media (prefers-contrast: more)）。**テストの無い @media は死にコードと
      変わらない**。見た目の確認はシステム設定を切り替えないと再現できず、
      次に --border-subtle を消す人は高コントラスト時だけ壊れることに気づけない。
      S40（既定の配色を固定する）と対になっており、こちらは
      emulateMedia({ contrast: 'more' }) の前後で比を測って
      「実際に上がること」を見る。とくに選択中タブの塗りは既定で 1.23 しかなく、
      高コントラストを求めた人に対して一番情報量のある表示が改善しないのでは
      意味がないので、上げ幅を明示的に検査する

  - id: S42
    title: ファイルをターミナルにドロップすると、エスケープされたパスが挿入される
    spec: S42-drop-path.spec.ts
    readme: false
    note: >-
      Finder からのドラッグは dataTransfer.files と text/uri-list の両方を持つが、
      files 側の絶対パスは webUtils.getPathForFile() でしか引けず、これは
      **本物の File にしかパスを返さない**（合成 File では空文字）。
      そのため E2E から検証できるのは uri-list 経路だけで、実装もその2段構えにしてある。
      検証の主眼は「PTY に文字が届くこと」ではなく「空白を含むパスがシェルで
      1トークンとして解釈される形になっていること」。ここが素通しになると、
      パスが2つの引数に割れたり、`;` や `$` を含む名前で別のコマンドが走る。
      なお **ペイン外へ落ちたときの画面遷移の抑止（main.tsx）は本シナリオの対象外**。
      合成した DragEvent では既定の遷移そのものが起きないため、
      テストを書いても常に green になり関門にならない（手動確認に回している）

  # --- cwd 追従 ---------------------------------------------------------------
  - id: S43
    title: シェルタブで cd すると、履歴一覧が移動先のものに切り替わる
    spec: S43-cwd-tracking.spec.ts
    readme: false
    note: >-
      Issue #58（cwd が起動時に固定される不具合）の再発防止。cd の追跡はシェル側に
      何も仕込まず、OS にプロセスの cwd を直接聞く方式（lsof -a -d cwd -p <pid> -Fn、
      src/main/pty/cwd.ts）を採る。OSC 7（cwd 通知のエスケープシーケンス）は
      macOS 既定の zsh が出さないため採用しなかった（出させるには .zshrc の書き換えか
      PTY 出力の横取りが要り、後者は CLAUDE.md の鉄則2「PTY の出力は加工しない」に
      触れる）。そのぶん検知は2秒間隔のポーリング（tabs/useTabs.ts の
      CWD_POLL_INTERVAL_MS）に依存し、最大2秒遅れる。harness.ts の otherWorkDir に
      workDir 側の3件とタイトルが被らない履歴を1件だけ用意し、「1件になった」だけでなく
      どちらのタイトルが出ているかまで確認する（逆向きに壊れていても件数は一致しうる）。
      移動前の履歴が消えることも合わせて見る

  # --- アクセシビリティ（Target Size） -----------------------------------------
  - id: S44
    title: 小さいボタンの当たり判定が 24x24 CSS px 以上ある
    spec: S44-target-size.spec.ts
    readme: false
    note: >-
      WCAG 2.2 の 2.5.8 Target Size（AA）。Issue #20 の調査で、タブ/通知/メモの
      閉じるボタンや履歴・検索の操作ボタンが軒並み 24x24 を割っていた
      （実測 8x14 〜 40x17）。styles.css は見た目のボタンは変えず、::before の
      透明な疑似要素で当たり判定だけを広げている。boundingBox() は疑似要素を
      測れないため、getComputedStyle(el, '::before') で疑似要素の実寸を読み、
      その矩形の四隅を elementFromPoint で実際にヒットテストするところまで見る
      （サイズだけ 24 あっても、何か別の要素に覆われて実際にはクリックが
      通らない、という揺り戻しを防ぐ）。履歴の「メモ」「編集」ボタンは隣接する
      当たり判定同士が重ならないことも確認する。通知バナーの閉じるボタンだけは
      既存のハーネスに実際のユーザー操作から再現する手段が無い（node-pty は
      macOS ではコマンド不在・cwd 不正のどちらでも同期的に例外を投げず、
      S11 の調査どおり非同期の exit にしかならないため）。実マークアップと
      同じ構造を一時的に body へ差し込んで、同じスタイルシートの下で
      当たり判定だけを測る（contrast.ts の againstColor 用プローブ要素と同じ手法）

  # --- 検索ショートカット（Issue #62） -----------------------------------------
  - id: S45
    title: Cmd+Shift+G で gemini が増えず、Cmd+G で検索が次のヒットへ進む
    spec: S45-search-shortcuts.spec.ts
    readme: false
    note: >-
      Cmd+Shift+G は Safari / Xcode / TextEdit など macOS 全域で「前を検索」の
      標準キーだが、以前は gemini の起動に割り当てており、検索中に反射で押すと
      本物の gemini が1本余計に起動する事故があった（Cmd+K を画面消去に残した
      経緯とまったく同じ型）。前半はタブ数が増えないこと・gemini タブが
      現れないこと・検索バーが開くことを見る（検索バーが閉じている状態からの
      Cmd+G/Cmd+Shift+G は「開くだけ」にする決定をしており、いきなり検索を
      実行しないのはこの前半の確認と対になっている）。後半は Cmd+G が
      「検索入力欄にフォーカスが無くても」次のヒットへ進むことを見る。
      ビューポートに収まらない間隔（150行のフィラー）で2箇所だけに現れる
      文字列を検索語にし、フォーカスをターミナル側へ戻してから Cmd+G を
      2回押して、画面に見えているマークが一致から不一致（＝別のヒットに
      移動した）へ変わることを確認する。ヒットの前後関係（xterm.js の
      SearchAddon が最初にどちらを拾うか）には依存させない性質ベースの検証

  # --- 編集中のショートカット抑止（Issue #63） --------------------------------
  - id: S46
    title: タブ名を編集中は Cmd+W が効かず、編集をやめると効く
    spec: S46-editing-shortcuts.spec.ts
    readme: false
    note: >-
      グローバルの keydown リスナー（App.tsx）は e.target を見ずにショートカットを
      先取りしていたため、タブ名編集中（.tab-bar__title-input にフォーカスがある
      状態）でも Cmd+W でタブが閉じていた。Issue #56（分割表示）で Cmd+D が
      分割に割り当たると、名前を打っている途中で知らないうちに PTY がもう1本
      増える壊れ方になる。前半でタブ名をダブルクリックして編集状態にし、
      Cmd+W を押してもタブ数もタブ名編集用 input も変化しないことを見る
      （ここが赤くなる＝素通しできていない）。後半で Escape により編集を
      キャンセルしたあと、同じ Cmd+W で今度はちゃんとタブが閉じることを
      同じテスト内で確認する。これは isEditableTarget（lib/shortcuts.ts）の
      素通しが効きすぎておらず、編集中でなくなれば通常どおりショートカットが
      機能することの担保（1 spec = 1 test の制約上、前半だけでは
      「全ショートカットを殺す実装」を誤って通してしまう）

  # --- タスク一覧のキーボード到達性（Issue #64） ------------------------------
  - id: S47
    title: キーボードだけでタスク一覧の押せる行に到達し、対応するタブにフォーカスが移る
    spec: S47-task-row-keyboard.spec.ts
    readme: false
    note: >-
      タスク一覧の行が `<li onClick>` のままで tabindex も role も無く、
      キーボードだけでは実行中セッションのタブへ飛べなかった（WCAG 2.1.1
      違反）。修正は `<li>` を保ったまま、押せる行だけを内側の `<button>` に
      する（押せない行は非対話のまま据え置く）。
      押せる行になる条件（ownedByApp && canFocus）を満たすため、agents.json
      の固定 sessionId と同じ ID を持つ履歴フィクスチャをこの spec だけの
      一時 HOME に追記し、それを resume することで markOwnedSession に
      同じ ID を登録させる（S15 が「固定フィクスチャでは positive case を
      作れない」とした制約を、resume 経由で回避する）。
      Tab キーだけで押せる行の <button> に到達できること、Enter で
      対応するタブがアクティブになり実際に xterm の隠し textarea まで
      フォーカスが移ることを見る。押せない行（other-project-idle）が
      依然として <div> のまま非対話であることも合わせて確認する。
