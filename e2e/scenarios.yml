      `.history-item__actions` をフローから外して実効幅を回復させるが、
      **そのとき見えないボタンがタイトルの上に浮く。** `opacity: 0` は
      ポインタイベントを止めないので、`pointer-events: none` を忘れると
      **タイトルの右端をクリックしたときに resume ではなく「編集」が発火する。**
      `.tab-bar__close` は同じ失敗モードを `pointer-events` で潰しており、
      その規則のコメントに理由が明記されているが、同じ規則が
      `.history-item__action` には適用されていない。S44 は「小さいボタン
      自身が 24x24 あるか」と「隣接する当たり判定同士が重ならないか」しか
      見ず、**大きい要素の内側に死角ができることは検出しない**（PR 19 で
      タブの中央が死角になった件と同型）。S19 は行の中央しか撃たない。
      S69 の履歴行版として、タイトルの矩形を左端から右端まで9点撃つ。
      実測（2026-08-03）は `.history-item__row` 139x77 / `.history-item__actions`
      88x21 / `.history-item__action::before` 38x24 で、`::before` の下端 200.5 と
      `.history-item__meta` の上端 201.5 の隙間は 1px しかないので、そこも見る。
      現状の幅（139 / 88）は characterization として固定してあり、周2 で
      235px 近くまで回復させる差分がレビュー資料になる。**実際に
      `position: absolute` だけを入れて `pointer-events` を省いた版で確認した
      ところ、9点中5点が resume に届かなくなって赤くなる。**

  - id: S75
    title: 3パネルの最上部に「いまどの範囲か」が常設され、区切りの見出しとは体裁が違う
    spec: S75-panel-scope.spec.ts
    readme: false
    note: >-
      Issue #20 の I-2 / Issue #119 の周3。サイドバーの3パネルは**スコープが
      全く違うのに同じ見た目で並んでいた**（タスク = 既定はマシン全体で他アプリ
      起動分も混ざる / 履歴 = アクティブなペインの cwd で `cd` に追従する /
      メモ = アプリのデータディレクトリ）。初見のユーザーは「3つとも、この
      アプリで開いたもののリスト」だと推測する。Dock バッジ（`updateDockBadge`
      は `scopeAgentsToCwd` に関わらずマシン全体を数える）が「3」なのに一覧が
      1件、という食い違いの説明にもなる。履歴だけは #117 で入っていた（S71 が
      文言を固定）ので、ここではタスクとメモの分と、3パネルで位置・体裁が
      揃っていることを見る。あわせて**見出しの階層**も固定する。本体ウィンドウ
      には `<h2>` がフラットに並ぶだけで **`<h1>` が1つも無く**、VoiceOver の
      ローターで辿っても階層が読めなかった。周3 で視覚的非表示の `<h1>` を足し、
      パネル内の区切り（`あなたの番 2件` / `全体メモ`）と空状態の見出しを
      `<h3>` に落とした。**「範囲」（`.panel-scope`、1パネルに1つ）と「区切り」
      （`.task-group__heading`、n 個）は周3 より前は宣言レベルで完全に一致して
      いた**ので、同じ見た目のまま範囲の行を足すとタスクパネルで「同じ体裁の
      見出しが3つ縦に並び、1つ目だけ意味が違う」状態になる。CSS の宣言そのものは
      test/unit/css-tokens.test.ts が突き合わせ、ここでは描画結果が違うことを見る。
      **日本語には `text-transform: uppercase` が効かない**ので、主な手がかりは
      下線のほう（`.panel-scope` だけが `border-bottom` を持つ）。

  # --- サイドバーのドラッグリサイズ（Issue #119 周4 / #20 PR 16） -------------
  - id: S76
    title: サイドバーをドラッグで広げられ、ドラッグ中は pty:resize が飛ばない
    spec: S76-sidebar-resize.spec.ts
    readme: false
    note: >-
      Issue #119 の周4（#20 の PR 16）。**関門はドラッグ中に `pty:resize` が
      飛ばないこと。** `.sidebar` の幅を実際に書き換えると `.terminal-stack` の
      実ピクセル寸法が変わり、`ResizeObserver -> fitAddon.fit() -> pty.resize()
      -> node-pty の TIOCSWINSZ -> SIGWINCH` まで連鎖する。しかも全タブの
      TerminalPane が同時にマウントされ、非表示タブも `visibility: hidden` で
      レイアウトを持つため `clientWidth === 0` のガードを通過する（タブ10枚なら
      1px 動かすたびに10回）。`PaneSplitterHandle.tsx` が確立したゴースト方式
      （`position: fixed` の線だけを動かし、実レイアウトは mouseup で1回だけ
      変える）を使い、S59 と同じ手法（`electronApp.evaluate()` に `ipcMain.on` を
      足して回数を数える）で固定する。**同じ実行の中で「ドラッグ中0回 /
      mouseup 後は1回以上」を両方見る**ので、カウンタが死んでいて 0 が出ている
      という空振りにならない。あわせて**幅を変えたあとに畳めること**も見る。
      幅を `style={{ width }}` で渡すと、インラインスタイル（詳細度 1,0,0,0）が
      `.sidebar.is-collapsed { width: 0 }`（0,2,0）に**必ず勝つ**ので #118 の
      折りたたみが黙って壊れる（実際にその版を作って S72 と S76 が両方
      落ちることを確認した）。`--sidebar-width` カスタムプロパティ経由なら
      `width` の宣言同士の後勝ちになり `.is-collapsed` が生きる。**S72 は
      既定幅で畳めることしか見ていない**ので、この壊れ方は S76 でしか
      捕まらない。2本目はドラッグの代替手段（WCAG 2.5.7 Dragging Movements）で、
      「表示」メニューの3項目が効くことと、**それらが accelerator を持たない**
      ことを見る（幅調整は 2〜5回/日で、`Cmd+英数字` の名前空間は 100手/日級の
      操作のために空けておく）。ドラッグの代替手段そのものは S77 が見る
      （台帳は 1 spec = 1 シナリオなので分けてある）。

  - id: S77
    title: サイドバーの幅をメニューから変えられる（ドラッグの代替手段）
    spec: S77-sidebar-width-menu.spec.ts
    readme: false
    note: >-
      Issue #119 の周4。**WCAG 2.5.7 Dragging Movements。** ポインタのドラッグで
      しか到達できない機能は、ドラッグ以外の単一ポインタ操作でも達成できなければ
      ならない。サイドバーの幅は「表示」メニューの `サイドバーを広げる / 狭める /
      幅を既定に戻す` が担う。**アクセラレータは持たせない**ことも固定する
      （`menu.ts` の `分割比を広げる / 狭める / 50%に戻す` と同じ形。幅調整は
      2〜5回/日で初日以降ほぼ0なので、`Cmd+英数字` の名前空間は 100手/日級の
      操作＝タブ切替・「あなたの番」へのジャンプのために空けておく）。
      **Electron は未設定の accelerator に `undefined` ではなく `null` を返す。**

  # --- タブバーの状態表現（Issue #119 周5 / #20 の B-3 と Phase 1 積み残し）---
  - id: S78
    title: 選択中タブに白い下辺の手がかりがあり、状態スロットが色だけに頼らない
    spec: S78-tab-state-and-selection.spec.ts
    readme: false
    note: >-
      Issue #119 の周5。**#20 の Phase 1 で唯一 3:1 に届かなかった箇所の答え。**
      `.tab-bar__tab.is-active` は塗りだけで選択を表しており、
      `--surface-tab-active` はタブバーの面に対し **1.23**（S40 が `wcag: 'fail'` で
      実測固定）。塗りをどう選んでも届かない（明るくするとタブの文字が読めなくなる）
      ので構造で解く。白（`--focus-ring`）2px の `box-shadow: inset 0 -2px 0`。
      **白である理由**: アクセントも `--border-control` も `prefers-contrast: more` の
      面（#525252）で 2.84 / 1.82 まで落ち、**高コントラストモードの利用者だけが
      手がかりを失う**。白は 13.58 / 7.81 で1〜3型でも比が動かない。
      **下辺のみである理由**: フォーカスリングが4辺白なので、選択状態も4辺白にすると
      フォーカスの有無が区別できなくなる（WCAG 2.4.13）。
      **`box-shadow: inset` である理由**: `border` は実寸を変えてタブの高さを動かし、
      外向きの影は `.tab-bar__tabs` の `overflow-x: auto` に端で切られる。
      **S40 では測れない**（`measureContrast` は単一プロパティを色として解決する
      実装で `box-shadow` は色以外の成分を持つ）ので、ここで文字列から色を取り出して
      `src/shared/theme.ts` の `contrastRatio`（S40 と同じ式）で比を計算する。
      あわせて `.tab-bar__state-slot` も見る。6px のスロットは PR #108 で幅だけ
      確保されて**空のまま**で、CSS 自身が「配線は別 PR」と書いていた（判定関数も
      データも既にあり、**唯一の利用者が `Cmd+J` だけ**）。周5 で「あなたの番」を
      配線し、終了マーク（四角）と**形で**区別できるようにした（丸 / 原則2）。
      **ドットが「出る」側は E2E では検証できない** — 偽 CLI の固定 `agents.json` の
      `sessionId` は実タブの `agentSessionId`（アプリが採番した UUID）と一致しない
      （`Cmd+J` の成功経路も同じ制約で未検証。解くのは #120 の D-2）。ここでは
      「出ない側」と、幅が常に確保されていること、形が違うことを見る。出る条件は
      `test/unit/tab-your-turn.test.ts` が固定している（**未知の status は
      第3の状態で、ドットを出さない** — CLI が新しい値を返し始めた日に
      全タブが橙になるのを防ぐ）。

  - id: S79
    title: ウィンドウタイトルがアクティブなタブに追従し、フルスクリーンで帯が畳まれる
    spec: S79-window-title-and-fullscreen.spec.ts
    readme: false
    note: >-
      Issue #119 の周5（#20 の K-5 / K-10）。**`win.setTitle()` の呼び出しも
      `enter-full-screen` の購読も、リポジトリ内に 0 箇所だった。**
      タイトルは `titleBarStyle: 'hiddenInset'` で画面上には出ないが、
      **ウィンドウメニュー・Mission Control・App Exposé には出る**（3つの
      リポジトリで同じアプリを開くと、どのウィンドウがどのプロジェクトかを
      見分ける手がかりがそこしかない）。2枚のタブで**名前が違うこと**まで
      見ないと「たまたま同じ」で通ってしまうので、そこも assert する。
      フルスクリーン中は macOS が信号機ボタンを隠すので、その下敷きにしている
      `.sidebar__drag-region`（36px）を残すと**何も無い帯だけがターミナルの上に
      居座る**。**Renderer からは判定できない**（`window.innerHeight` や HTML5 の
      Fullscreen API は要素の全画面表示で、macOS のウィンドウのフルスクリーンとは
      別物）ので Main から `IpcEvent.fullScreenChanged` で流す。
      **タブバーは畳まない**（畳むとタブの切り替えがマウスから不可能になる）ことも
      あわせて固定する。**`trafficLightPosition` の再適用は検証できない** —
      Electron に読み戻す API が無く（`getTrafficLightPosition` は 43 に存在しない。
      S73 で実際に呼んで確認した）、信号機はネイティブの NSButton で DOM にも
      現れない。復帰時に `setWindowButtonPosition` を呼んでいることまでが実装の
      担保で、位置の一致は `test/unit/css-tokens.test.ts` が導出ごと固定している。
      **OS 側（`win.isFullScreen()`）とアプリ側（`.app` のクラス）は別々に待つ**
      （Issue #179 の周4-0）。`setFullScreen(true)` は AppKit へ要求を出すだけで、
      Space を作って遷移するかは WindowServer の状態次第 = **このリポジトリの
      コードの外**。分けずに書いていたため、2026-08-04 に遷移が起きない日が来たとき
      「アプリの回帰か環境要因か」が読めず、`main` へ戻して再ビルドする切り分けに
      丸1日かかった（同じコミットで翌日は 11/11 green）。⛔ **`test.skip()` にはしない** —
      飛ばすと `enter-full-screen` の経路が壊れた日に誰も気づかない。

  # --- 配色プリセット（Issue #119 周6 / #20 の PR 18） -----------------------
  - id: S80
    title: 配色プリセットを選ぶと、ターミナルとクロームが一緒に変わる
    spec: S80-theme-preset.spec.ts
    readme: false
    note: >-
      Issue #119 の周6。`src/shared/theme.ts` の「`theme.background` から
      クロームの面を導出する」仕組みは PR #101 で入っていたが、**切り替える UI が
      無かった**ので、テーマを変える手段は `config.json` の直接編集だけだった。
      ここで見るのは「**ターミナルとクロームが一緒に変わる**」こと。片方だけ変わる
      半適用がこの機能の主な故障モードで、プリセットに閉じた理由そのもの
      （`useTerminal.ts` は `chromeSafeToApply` を見ずに `term.options.theme` を
      無条件に適用する一方、`App.tsx` はクロームの面の適用を見送るため、
      任意の色を選べると「端末だけ明るくなりクロームが暗いまま残る」）。
      プリセットの安全性は `test/unit/themes.test.ts` が関門にしている
      （**Nord / Dracula / One Dark / Gruvbox Dark は実測で全滅**した。
      背景が明るめで、面を導出すると `--text-tertiary` が 4.5:1 を割る）。
      **`.xterm-viewport` では背景を取れない**（`rgb(0,0,0)` を返す）。xterm は
      ITheme の background を `.xterm-scrollable-element` のインラインスタイルに
      書くので、S21 と同じ要素を見る。既定へ戻したときに**インライン値が残らない**
      ことも見る（周6 で直したバグ。以前は `chromeSafeToApply` が false のときに
      `return` するだけで、前のテーマの面が `documentElement.style` に残り続けた）。
      **`S21-config.spec.ts` は無傷** — `themeName` 未設定なら保存済みの `theme`
      （4色）が勝つ設計で、逆にすると config.json に手で書いた設定が黙って
      無視される。

  # --- Issue #120 周1: キーボードの決着 --------------------------------------
  - id: S81
    title: Cmd+= / Cmd+- でターミナルの文字サイズだけが変わり、設定に保存される
    spec: S81-font-size-shortcut.spec.ts
    readme: false
    note: >-
      Issue #120 の周1。文字サイズの変更手段は設定ウィンドウの往復だけだった。
      **`Cmd+-` / `Cmd+0` は「何も起きない」のではなく、別のものが動いていた** —
      `menu.ts` の `role: 'zoomIn' / 'zoomOut' / 'resetZoom'` は `actionItem()` を
      通らないため `registerAccelerator: false` が付かず、menu.ts が謳う
      「キーを実際に拾うのは matchShortcut 1箇所」という原則の**唯一の例外**だった。
      押すと Renderer 全体（サイドバーもタブバーも）の拡大率が変わり、
      `config.json` にも保存されないので次回起動で戻る。周1 で zoom の `role` を
      外し、同じキーを `AppConfig.fontSize` に割り当てた。ここでは
      (1) キーで xterm の文字サイズが変わる (2) **サイドバーは変わらない**
      （zoom との決定的な違い）(3) `config.json` に保存される (4) `Cmd+0` で
      既定に戻る、を見る。**「同じキーが2系統から発火しない」ことは S36 が
      `role` の不在で固定する**（そちらは小文字で比較する。**Electron は
      `MenuItem.role` を正規化した小文字で返すため、`toggleDevTools` のような
      キャメルケースで比べていた既存の2件は一度も機能していなかった**）。
      `Cmd+1` がタブ切替のままであることも見る（`/^[1-9]$/` を `[0-9]` へ
      広げると index が -1 になって壊れる）。

  - id: S82
    title: Cmd+Option+W は分割中のタブも1手で閉じる
    spec: S82-close-tab-shortcut.spec.ts
    readme: false
    note: >-
      Issue #120 の周1。`Cmd+W` は `close-pane` で、**残るペインが1枚なら
      タブごと閉じる**ので分割していないタブでは macOS 標準どおりに振る舞うが、
      **分割中のタブを閉じるにはペインの枚数ぶん押す必要があった**（他ターミナルの
      筋肉記憶では `Cmd+W` 一発でタブが消えるので「閉じたつもりが半分残る」）。
      メニューの「タブを閉じる」はキーを持っていなかった。`Cmd+Shift+W` は
      macOS 全域で「ウィンドウを閉じる」と学習されているので使わない。
      **判定は `e.code`**（macOS では Option を押しながらの英字キーは合成後の
      文字が `e.key` に入りうる。Option+w -> `∑`。`Cmd+Option+S` と同じ理由）。
      2本の PTY を一度に閉じるので既存の確認ダイアログを通ることも見る。

  - id: S83
    title: Cmd+Option+1/2/3 でサイドバーのパネルを切り替えられ、選択が機械可読になっている
    spec: S83-sidebar-panel-keyboard.spec.ts
    readme: false
    note: >-
      Issue #120 の周2（旧 #111）。3パネル切替は素の `<button>` 3つで、
      **マウスでしか押せなかった**（`shortcuts.ts` に分岐なし / `AppAction` に
      種別なし / `menu.ts` に該当の語が 0 箇所）。**`Tab` キーでも到達できない** —
      xterm のヘルパー textarea が Tab を端末入力として消費するので、
      フォーカスがターミナルにある限り DOM のフォーカス順に出られない。
      WCAG 2.1.1。選択状態も `className` の `is-active` だけで `role` /
      `aria-selected` のいずれも無く、塗りの差は **1.08**（S40 が `wcag: 'fail'` で
      固定）なので支援技術にも色の弱い利用者にも伝わっていなかった。WCAG 4.1.2。
      **`Cmd+Shift+1/2/3` は使えない**（`Cmd+Shift+3/4/5` は macOS の
      スクリーンショットにシステムが先に奪う。「3パネルだから 1/2/3」は3番目で
      必ず破綻する）。`Cmd+Option+` に寄せたのは `Cmd+Option+S`（表示切替）が
      既にそこにあるため。**判定は `e.code`**（Option+1 の `e.key` は `¡`）。
      **`<button>` 要素そのものは変えていない** — `e2e/` の 28 ファイル・44 箇所が
      `.sidebar__tabs button` を使うので、要素を変えると全部落ちる。`role` を
      足すだけ。畳んでいるときは開いてから切り替えることも見る（**「何も起きない」で
      終わらせない**。畳んだまま切り替えても画面が1pxも動かず壊れて見える）。

  # --- tmux 経路（Issue #121 A-3 / 周2） --------------------------------------
  - id: S84
    title: 偽 tmux でラップした claude タブは検索バーに tmux 注記が出て、シェルタブには出ない
    spec: S84-tmux-search-hint.spec.ts
    readme: false
    note: >-
      Issue #121 A-3 / 周2。`.claude/skills/e2e/reference/limitations.md` は
      「E2E では tmux 経路を踏めない」としていたが、これは誤りだった。
      harness.ts は PATH の先頭に一時 HOME 配下の bin を置いており、
      `e2e/fixtures/bin/tmux`（偽 tmux。`-- ` 以降をそのまま exec するだけの
      シム）を置くだけで `config.useTmux: true`（`isTmuxAvailable()` は
      `which tmux` を見るだけ）の経路を決定的に踏める。harness.ts には
      `fakeTmux` オプションを足した（既定 false。既存シナリオの PATH には
      従来どおり claude / gemini の2本しか置かれず、挙動は1つも変わらない）。
      本題は `SpawnPtyResult.wrappedInTmux` が `useTabs.ts` -> `PaneLeaf` ->
      `PaneTreeView` -> `TerminalPane` まで届き、検索バーの tmux 注記
      （`.terminal-search__hint`。同じ周で実装済み）として画面に表示される
      ところまでを実測すること。シェルタブ（`req.kind === 'shell'` は
      `maybeWrapWithTmux` が常に素通りする）では出ないことも見る。
      偽 tmux が書き出したセッション名（`aiterm-<agentSessionId>` の形）を
      ファイルから読み、「画面の辻褄だけ合わせて実際には tmux を経由していない」
      実装を見逃さないようにしている。**このシムで担保できないこと**:
      代替画面バッファへの切り替え、セッションの永続化（アプリ再起動後の
      再アタッチ）、タブを閉じても claude プロセスが生き残ること、`-A`
      （attach-or-create）の分岐。偽 tmux は `exec` するだけで、tmux 本来の
      サーバプロセスを持たないため。詳細は spec 冒頭のコメントを参照。

  # --- ペイン名（Issue #130） --------------------------------------------------
  - id: S85
    title: 分割した2枚のペインに別々の名前を付けると、両方のヘッダに同時に出る
    spec: S85-pane-rename.spec.ts
    readme: false
    note: >-
      Issue #130。`useTabs.ts` の `splitActivePane` は必ず
      `spawnLeaf('shell', 'zsh', activeLeaf.cwd)` を呼ぶ（分割で作れるのは
      シェルだけで、cwd は分割元から必ず引き継ぐ）ため、**分割した2枚の
      ヘッダは 100% 必ず同一文字列になる**。名前を付けられなければ、
      どちらがどちらか文字からは永久に分からない。この spec はまず
      「名前を付ける前は一致している」ことを assert してから、付けたあとに
      分かれることを見る（前提が崩れたら気づけるようにするため）。
      **メニュー項目「ペイン名を変更...」の存在も `Menu.getApplicationMenu()`
      で走査して見る。** それまでリネームは `TabBar.tsx` の `onDoubleClick`
      だけで `AppAction` にも `menu.ts` にも無く、キーボードから1手も
      到達できなかった（WCAG 2.1.1）。ここが無いと「動くが誰も見つけられない
      機能」になる（Issue #22 と同型）。あわせて `title` 属性（`.pane-header` は
      `text-overflow: ellipsis` で省略されるのに、切れた文字列を読む手段が
      画面上にも読み上げにも1つも無かった）と、`role="group"` の aria-label が
      可視テキストで始まること（WCAG 2.5.3 Label in Name）を見る。
      ヘッダを2要素にせず単一スロットにしたのは、分割の下限幅
      （`MIN_PANE_COLUMNS = 20`）でヘッダの文字領域が約 148.6px しか無く、
      2要素の必要幅 208.7px に届かないため（5ペルソナのレビューで4人が独立に計算）。

  # --- タブの見出しの出所（Issue #131） ---------------------------------------
  - id: S86
    title: 分割中にペインを移ってもタブの見出し・プロバイダ色・ウィンドウ名が変わらない
    spec: S86-tab-title-stable.spec.ts
    readme: false
    note: >-
      Issue #131。それまでタブは名前という属性を持たず、タブバーは
      `tabLeaf(tab)`（＝いま選んでいるペイン）の `title` を借りていた。
      借り先が「今選んでいるペイン」なので、`Cmd+]`（`shortcuts.ts` 自身の
      見積もりで **40〜80回/日**）を押すたびに、見出し・タブ上端のプロバイダ色・
      ツールチップ・**Mission Control 上のウィンドウ名**が同時に書き換わっていた。
      ウィンドウ名は「どのウィンドウがどのプロジェクトか」を見分けるために
      入れたもの（`App.tsx` に意図が明記されている）なので、**分割している間だけ
      その目的が消えていた**。
      **claude タブを分割して検証する。** 分割で作られるのは常にシェルなので
      左が claude・右が shell になり、`Cmd+]` でプロバイダ色まで往復する。
      シェルタブを分割すると両方 shell になって色の往復が起きず、**検査が
      意味を持つ条件を踏めない**（loop.md「検査は正しいが、その条件を
      踏んでいない」）。spec 内でその条件（左が claude・右が zsh）も assert する。
      あわせて (d) 案の要点2つを見る: タブ名を編集しても**ペインの名前は
      変わらない**こと（入り口と対象の一致。それまでタブのダブルクリックは
      ペインを書き換えていた）と、名前を付けたタブは**先頭ペインを閉じても
      見出しが変わらない**こと（借り先を先頭 leaf に固定するだけの案では、
      `closePane` が木を畳んで別の leaf が繰り上がるため見出しがジャンプする）。

  - id: S87
    title: 分割したタブの終了表示が、どのペインが終了しているかで決まる
    spec: S87-tab-exit-across-panes.spec.ts
    readme: false
    note: >-
      Issue #160 周1 / Issue #142 の**関門**。タブの終了表示（`TabBar.tsx` の
      `leaf.exit` 参照4箇所 = 文字色・状態スロットの四角・可視バッジ・読み上げ）が、
      分割したタブの中で**どのペインが終了しているか**にどう反応するかを固定する。
      **characterization テストで、1つ目のケースは確定仕様に反した現状を記録している**
      （`.claude/workspace/issue-56/design-review.md:81` は「全 leaf が終了した
      ときだけ出す」と確定させているが、実装は `tabLeaf(tab).exit` =
      アクティブな leaf しか見ていない）。実測したところ「片方だけ exit /
      両方 exit」を見るテストは e2e にも unit にも1本も無く、**`every` に変えても
      `some` に変えても全部 green のまま**だった。3ケース（終了ペインが
      アクティブ / 生存ペインがアクティブ / 両方終了）を書くことで、現状・
      `some`・`every` の3つの挙動が互いに区別できる。**周2（#142）で
      1ケース目の期待値を反転させ、`tabAllPanesExited`（tabPane.ts）へ
      差し替えた。** いまはケース1 と ケース2 がどちらも「出さない」で、
      **同じ木なのに `Cmd+]` で表示が変わらない**ことがそのまま検査になっている。
      **もう characterization ではない**（周2 で期待値を反転させた時点で、
      確定仕様そのものの関門になった）。
      **Issue #166（#179 周3）でケース4 を足した。** 終了に severity が入り、
      層ごとに出る条件が分かれたため（`.is-exited` / バッジ / 読み上げは終了なら
      必ず出る、`.is-exited-abnormal` と状態スロットの四角は**異常終了だけ**）、
      「4箇所が揃って 0 / 揃って 1」ではなく**層ごとの枚数**で見る形に変えた。
      ケース4 は分割した新しいタブの片方を `exit 7`・片方を `exit` で終わらせ、
      **`some` 集約**（1枚でも異常ならタブは異常）を固定する。`every` にすると
      異常の枚数が 0 のままになって落ちる。あわせて「終了したタブは2枚あるのに
      四角は1つ」＝**正常終了はスロットを塗らない**ことも、色を1つも読まずに
      枚数だけで固定している。

  - id: S88
    title: 画面に出るシェル名が、実際に起動したシェル（config.shell）を反映する
    spec: S88-shell-name-follows-config.spec.ts
    readme: false
    note: >-
      Issue #137。Renderer が `'zsh'` をリテラルで4箇所持っており、
      `$SHELL=/bin/fish` の人にも `zsh` と表示していた。決定順の唯一の正は
      Main の `buildShellPlan()`（`config.shell -> $SHELL -> /bin/zsh`）で、
      Renderer は `AppConfig.shell` を読んでも既定が undefined なので
      `$SHELL` を知りえない。そこで `SpawnPtyResult.shellName` ->
      `PaneLeaf.shellName` で値を運ぶようにした（`wrappedInTmux` と同型。
      spawn の瞬間に1回だけ決まる値なので leaf に持つ）。
      **既存の関門（S57 / S86 / test/unit/pane-header.test.ts / 撮影）は
      すべて「zsh と出る」を見ているが、ハーネスの `$SHELL` が `/bin/zsh` である
      以上、リテラルに戻しても全部 green のまま**だった（loop.md の
      「検査は正しいが、その条件を踏んでいない」）。本シナリオは
      `launchApp({ config: { shell: '/bin/bash' } })` で `$SHELL` と違うシェルを
      踏み、タブ見出し・ペインヘッダ・aria-label の3つの出口すべてが追従すること、
      および `zsh` がどこにも残っていないことを見る。
      **プロンプトを待たない**（ハーネスの `PROMPT` は `.zshrc` に書いてあり
      bash では効かない）。

  - id: S89
    title: Cmd+J が、分割したタブの裏で待っている claude のペインまで着地する
    spec: S89-your-turn-jump-lands-on-pane.spec.ts
    readme: false
    note: >-
      Issue #132。`findNextYourTurnTab` は tabId しか返しておらず、呼び出し側は
      `setActiveTabId` しかできなかった。分割しているタブでは**タブが前に出ても
      アクティブなペインは前のまま**なので、待っている claude が裏のペインに
      居ると飛んだ先で入力できない（タブ止まり）。`findNextYourTurnPane` へ
      置き換え、着地は通知クリック・タスク一覧クリックと同じ
      `focusPaneLocation` を通す。
      **「このハーネスでは成功経路を作れない」という注記は古かった。**
      S68 / S78 / S63 と本ファイルの4箇所が「解くのは Issue #83」と書いていたが、
      #83 は CLOSED で `setAgentEntries()` は実装済み。S63 の
      「履歴 resume なら agentSessionId を決め打てる」手法と組み合わせれば、
      偽 CLI の出力とアプリが実際に起動したセッションを一致させられる。
      本シナリオがその実例で、**#160 の周6 で4箇所の注記も是正した**。

  - id: S90
    title: Cmd+W で回収できる gemini ペインは確認なしで閉じ、2枚同時なら確認が出る
    spec: S90-close-pane-orphan-confirm.spec.ts
    readme: false
    note: >-
      Issue #158 -> **#155 で前提が反転した**。元は「tmux + gemini は閉じると二度と
      回収できないので `Cmd+W` でも確認を出す」だったが、gemini にも安定した
      `agentSessionId` が入り（S102）、分類が `ptyKind` から **`agentSessionId` の有無**へ
      変わったので、**1ペインでは確認が出なくなった**（確認は不可逆なものだけに絞る、
      という #121 周5 の原則どおり）。
      いま見るのは4つ:
      (1) シェルの `Cmd+W` では確認が出ない（**否定側を先に置く**。あとに置くと、
      直前の確認をキャンセルした状態のせいで通ったのか区別しにくい）、
      (2) tmux + gemini の `Cmd+W` でも確認が出ずに閉じる、
      (3) ⭐ **確認を消した分の受け皿（閉じた直後の告知）が実際に鳴る**
      （design-review で4人が「削除ではなく降格にせよ」と指摘した本体。
      これが無いと「確認をやめただけで何も伝えない」実装でも green になる）、
      (4) 2枚を一度に閉じるときはいまも確認が出る
      （**確認の機構ごと消す直し方**でも (1)(2)(3) は green になるため、残る条件を必ず踏む）。
      ⛔ **`.terminal-pane` の総数で分割を確かめない。** この spec の時点でタブが2枚
      あるので、分割していなくても総数は2になる（実際にこれで空振りした）。
      **アクティブなタブの x ボタンのラベル**がそのタブのペイン数だけを見ている。
      ⛔ 告知は「同じ文言を連続で出しても鳴る」ところまで見る。素の `useState<string>` だと
      **同じ値では DOM のテキストが変化せず live region が鳴らない**ので、
      key で要素ごと差し替えているかを**ノードの同一性**で確かめる（テキストは同じなので
      内容では区別できない）。

  - id: S91
    title: ターミナル面の右クリックでメニューが出て、項目を選ぶと既存の操作が走る
    spec: S91-terminal-context-menu.spec.ts
    readme: false
    note: >-
      Issue #135。`contextmenu` / `Menu.popup` はそれまでアプリ全体に0件で、
      Terminal.app / iTerm2 / Ghostty がいずれも持つ導線が無かった。
      **ネイティブ（Main の `Menu.popup()`）を選んだ**（design-review の5人中3人）。
      HTML メニューは `.terminal-stack` / `.pane-split__cell` の
      `overflow: hidden` で切られ、DOM フォーカスを奪って DECSET 1004 の
      `ESC [ O` を PTY へ流し、コピー / ペーストが xterm 本来の経路
      （bracketed paste を含む）から外れる。理由は
      `src/shared/context-menu.ts` の冒頭が正。
      **「ネイティブは E2E で検証できない」は誤りだった** — `Menu.prototype.popup`
      は JS 側にあるので `app.evaluate()` から差し替えられ、項目も `click()` も
      取れる（Electron 43 で実測）。本シナリオは**本物を開かずに**
      （ネイティブメニューはモーダルなトラッキングループに入るため）配線を見る:
      右クリック -> Renderer が状況を送る -> Main が popup を呼ぶ -> 項目を
      click すると既存の `AppAction` が流れて実際に分割される。
      あわせて「1ペインでは『ペイン』という語を出さない」「選択が無ければ
      コピーが無効」「右クリックしたペインがアクティブになる」も見る。
      **項目・並び・語・有効/無効の正は `test/unit/context-menu.test.ts`。**

  - id: S92
    title: ターミナルのリンクは既定ブラウザへ渡り、アプリ内に窓が生まれない
    spec: S92-external-link-opens-in-browser.spec.ts
    readme: false
    note: >-
      Issue #178 周1（統合元 #174）。`setWindowOpenHandler` はアプリ全体に0件で、
      `window.open()` に対して Electron が**アドレスバーも戻るボタンも無い
      `BrowserWindow`** を自前で作っていた。その窓には Renderer 側の `Cmd+W`
      （`close-pane`）が届かないので、剥がすには信号機をマウスで押すしかない。
      エージェントは PR リンク・localhost・docs を1日中吐くため、誤爆1回あたり
      8〜9手 × 3〜10回/日 の損失になっていた。
      見るのは**逃がしの配線**: `window.open()` -> アプリ内に窓が増えない
      （`{ action: 'deny' }`）-> `shell.openExternal` に URL が渡る。
      `shell.openExternal` は `app.evaluate()` から差し替えて記録するだけにし、
      **本物のブラウザを起動しない**（S91 の `Menu.prototype.popup` と同じ枠組みで、
      production コードにテスト用のフックを入れていない）。
      **どのスキームを弾くかの網羅は `test/unit/external-links.test.ts` が正**
      （開いた先は Playwright から観測できないので、判定は純粋関数
      `isSafeExternalUrl` に切り出してある）。ここでは**その門が実際に配線に
      載っていること**を `file:` 1件で見る。
      あわせて**設定ウィンドウ側にも同じ逃がし先が付いていること**を見る
      （ウィンドウ生成点は2つあり、片方への付け忘れがそのまま穴になる）。

  - id: S93
    title: ターミナルのリンクは Cmd+クリックでだけ開き、素のクリックでは開かない
    spec: S93-link-requires-cmd-click.spec.ts
    readme: false
    note: >-
      Issue #178 周2（統合元 #174）。`@xterm/addon-web-links` は修飾キーを一切
      見ずにハンドラを呼ぶ（`ILinkProviderOptions` は hover / leave / urlRegex
      しか持たない）ため、**カーソルを置くつもりの素の左クリックでもリンクが
      発火**していた。iTerm2 / Ghostty / Terminal.app はいずれも Cmd+クリックを
      要求するので、同じ作法に寄せる。
      **修飾キーの組み合わせの網羅は `test/unit/link-activation.test.ts` が正**で、
      ここでは代表2ケースが**実際の xterm 上のクリックで**そう振る舞うことを見る。
      ⛔ **Cmd+クリックを先に試す**（逆順だと座標がリンクから外れていても
      「素のクリックで発火しない」が green になり、何も検証しない spec になる）。
      さらに、クリックする前に**その座標で `cursor: pointer` になっていること**を
      assert して、検査が意味を持つ条件を同じ spec の中で固定している。

  # --- WebGL コンテキスト喪失（Issue #179 周4 / 統合元 #167） -----------------
  - id: S94
    title: WebGL コンテキストを失ってもターミナルの文字が消えず、DOM レンダラへ落ちる
    spec: S94-webgl-context-loss.spec.ts
    readme: false
    note: >-
      Issue #167（#134 の design-review で a11y が指摘）。このアプリは**全タブ・
      全ペインを同時にマウントしたまま**（`visibility` だけで切り替える）ので、
      **WebGL コンテキストがペイン数ぶん同時に生きる**。Chromium の1レンダラ
      あたりの上限は16前後で、超えると古いものから黙って失われる。
      放置すると**そのペインは真っ白なキャンバスになるが、a11y の DOM は生き残る** —
      支援技術には読めていて、**晴眼の利用者にだけ主コンテンツが消える**。
      `WebglAddon` は `webglcontextlost` の**3秒後**に `onContextLoss` を発火する
      （`webglcontextrestored` を待つ猶予。`WebglRenderer.ts`）ので、そこで
      `dispose()` すると xterm がコアの既定レンダラ（DOM）へ差し替える。
      S23 と同じく **GPU 有効レーン**（`launchApp({ gpu: true })`）で回す。
      喪失は `WEBGL_lose_context` 拡張で意図的に起こす。
      ⛔ **canvas が消えたことだけを見ない**（`dispose()` し忘れても canvas は
      残らない書き方がありうる）。**文字が DOM に戻ってくること**まで見る。
      それが利用者にとっての「消えていない」の中身。

  # --- 「+ ▾」メニューの可視性（Issue #179 周5 / 統合元 #170） -----------------
  - id: S95
    title: 「+ ▾」のメニューが、タブが溢れていても通知が出ていても実際に画面に出る
    spec: S95-new-tab-menu-visible.spec.ts
    readme: false
    note: >-
      Issue #170。**関門は4本あって、4本とも「見えていない」ことを検出しなかった**
      （S06 / S64 / S69 / S78）。`toBeVisible()` は**祖先のクリッピングを見ない**し、
      Playwright のクリックは `scrollIntoViewIfNeeded()` を挟むので**切られていても押せる**。
      キーボードは開いた瞬間に先頭項目へフォーカスが乗るので**見えないまま通る**。
      実機ではメニューが1点も当たり判定に出ず、開くとタブのほうが画面外へ押し出されていた
      （`.tab-bar__tabs` が `overflow-x: auto` なので `overflow-y` も `auto` に計算される）。
      原因は3つあり、**入れ子を直すだけでは1つしか消えない**ので3構成で見る:
      タブ1枚（縦クリップ）/ 通知バナー1枚（`z-index` が `.notice-list` の 20 に負ける）/
      タブ12枚（左端揃えのメニューがウィンドウ右端からはみ出す）。
      ⛔ **中心1点で `elementFromPoint` しない**（中心はちょうど2番目の項目に当たるので、
      上下 1/3 のクリップを素通しする）。**3項目 x 3点 = 9点**で見る。
      ⛔ **`scrollTop` を読む前に先頭項目のフォーカスを待つ**（スクロールは `focus()` の
      effect で起きるので、`click()` 直後に読むと壊れたビルドでも 0 が返る）。

  # --- 検索の選択引き継ぎ（Issue #179 周6 / 統合元 #175） ---------------------
  - id: S96
    title: Cmd+F は xterm の選択を検索欄に引き継ぎ、選択が無いときは前回の語を消さない
    spec: S96-search-seed-from-selection.spec.ts
    readme: false
    note: >-
      Issue #175。macOS の「Use Selection for Find」（`Cmd+E`）を
      **直前のタブへ戻る**に割り当てているので、**奪ったまま代替が無かった**。
      選択 -> `Cmd+C` -> `Cmd+F` -> `Cmd+V` -> Enter の**5手**が、
      選択 -> `Cmd+F` -> Enter の**2手**になる。⛔ **新しいキーは足さない**。
      ⛔ **「選択が無い = 検索欄を空にする」ではない。** 端末の行は右端まで空白で
      埋まっているので、**行末の余白を撫でただけで空白の塊が取れる**。それで前回の
      検索語を上書きすると、`Cmd+F` が「前回の語をもう一度探す」用途に使えなくなる。
      そこで3段で見る: 選択が無いときは空のまま / ドラッグ選択した語が入る（前後の
      空白が落ちていることまで）/ 選択を解いて開き直しても前回の語が残っている。
      語の判定そのもの（空白だけ・複数行・日本語）は `test/unit/search-seed.test.ts` が正で、
      ここでは**実際の xterm の選択が実際の検索欄まで届くこと**だけを見る。
  - id: S97
    title: タブが溢れていても、選ばれたタブは可視域へスクロールインする
    spec: S97-active-tab-scrolled-into-view.spec.ts
    readme: false
    note: >-
      Issue #180 引き継ぎ周7。`scrollIntoView` / `scrollLeft` は `src/renderer/` に
      **0件**だった。⚠ **`S54` が12枚で緑なのは、この不具合が無いことの根拠にならない。**
      あちらは**キーボードでタブバーの中を移動する**経路で、`focus()` の副作用として
      ブラウザが勝手にスクロールインしている。壊れていたのは
      **DOM フォーカスを1ミリも動かさない経路**（`Cmd+1-9` / `Cmd+Shift+]` /
      `Cmd+J` / 通知クリック）で、そちらが日常の主役。既定 1200px で同時に見えるのは
      約 7.2 枚、実運用 8〜12 枚なので **28% が画面外**に着地していた。
      ⚠ **測る前にスクロール位置を作り直す。** 右端に居るまま「次のタブ」を測ると
      **最初から見えていて実装を消しても緑**になる（初版が実際にそうだった）。
      ⚠ 「タブバーが縦に押し出されていない」の1行は**いまは恒真のカナリア**
      （`block: 'nearest'` を外しても赤くならないことを実測済み。縦に送れる余地が無いため）。
      Issue #170 の幾何がもう一度生まれた日にだけ意味を持つので、承知のうえで残している。
  - id: S98
    title: 設定ウィンドウを動かして閉じ、開き直すと同じ位置と高さで出る
    spec: S98-settings-window-state.spec.ts
    readme: false
    note: >-
      Issue #153 / #180 周4。直す前は `openSettingsWindow()` が
      `new BrowserWindow({ width: 520, height: 640 })` とリテラル固定で作っており、
      開き直すたびに既定へ戻っていた（実測: `{ x: 460, y: 130, height: 640 }`）。
      **横幅は保存対象にしない**（`minWidth === maxWidth === 520` で仕様として固定）。
      ⚠ **本体ウィンドウの状態を巻き込んでいないことも同時に見る。** 保存先は
      `window-state.json` 1ファイルで書き手が2つあり、読まずに書くと
      **後から保存したほうが相手のキーを消す**。
      ⚠ **順序に意味がある。** 消し合いは双方向なので、片方向しか踏まない順序で書くと
      **もう片方を壊しても緑のまま**になる（初版が実際にそうだった: 設定を閉じるときの
      保存が、本体の保存で消えたキーを書き戻してしまい「本体が設定を消す」向きを
      検出できなかった）。**設定を閉じた直後にファイルを見る -> そのあと本体を動かす**
      の順で両方向を踏む。
      画面外へ動かしたときに位置だけ捨てる経路（`isVisibleOnSomeDisplay`）も同じ spec で見る。
      ⚠ **`move` イベントはこのレーンでは飛ばない。** 隠したウィンドウに `setBounds()` を
      当てると macOS では `resize` だけが発火する（実測。`move` は 0 回）ので、
      **ドラッグでの移動が保存されることはこの spec では担保できない**。
      承知のうえで `resize` 側だけを固定している。
  - id: S99
    title: 支援技術を検知しているときだけ、設定に「いま有効です」が出る
    spec: S99-screen-reader-detected-notice.spec.ts
    readme: false
    note: >-
      Issue #149 / #180 周4-b。直す前は、設定値（チェックボックス）と実効値
      （`config.screenReaderMode || accessibilitySupport`）の食い違いが**画面のどこにも
      出ていなかった**。⭐ **検知状態は E2E から作れる**（`app.accessibilitySupportEnabled = true`
      を `app.evaluate` から代入でき、`accessibility-support-changed` も実際に発火する。
      VoiceOver は要らない。2026-08-05 実測）。
      ⚠ **先に「出ていない」ことを assert する。** これが無いと**常に出す実装でも green**
      になる。⚠ **アクセシブル名が注記で汚れていないことも見る**（`<label>` の中に入れると
      WCAG 2.5.3 を割り、かつ2列グリッドの2行目に落ちて崩れる）。
      ⚠ この spec は検知フラグを**開く前**に立てる。開いたまま切り替えても届くこと（追従）は
      `src/main/accessibility.ts` の送信先の話で、そちらは `S100` が見る。
  - id: S100
    title: 設定ウィンドウを開いたまま支援技術を検知しても、表示と読み上げ用 DOM が追従する
    spec: S100-accessibility-broadcast.spec.ts
    readme: false
    note: >-
      Issue #149 の後半 / #180 周4-b。直す前の `registerAccessibilityHandlers(win)` は
      登録時のウィンドウを閉包で掴み、`accessibility-support-changed` を**本体ウィンドウ
      1枚にしか送っていなかった**。⭐ **これは表示の追従だけの話ではない。**
      `index.ts` の `app.on('activate')` が本体ウィンドウを作り直すと、掴んでいるのは
      最初のウィンドウなので **以後 `isDestroyed()` で永久に early return** し、しかも
      `ipcMain.handle` は二重登録で throw するので張り直しもできなかった。
      ⚠ **`S99` とは向きが違う。** あちらは検知フラグを**開く前**に立てて
      「マウント時の invoke」を見る。こちらは**開いたまま**立てて「イベントが届くか」を見る。
      片方だけだと、もう片方の経路を壊しても緑のままになる。
      ⭐ 本体ウィンドウ側の `.xterm-accessibility` も同時に見る（**自動検知の経路には
      これまで E2E が1本も無かった**。S37 は `config.screenReaderMode: true` の経路だけ）。
  - id: S101
    title: 分割しても、入力欄の名前でどちらの端末か区別できる
    spec: S101-terminal-input-label.spec.ts
    readme: false
    note: >-
      Issue #150 / #180 周5。直す前は `.xterm-helper-textarea` が**全ペイン
      `Terminal input`**（英語の既定）だった。分割すると支援技術のローターに同じ名前が
      並び、どちらの端末か区別できない。
      ⛔ **`Terminal.strings.promptLabel` では解けない**（**static** なのでインスタンスごとに
      別の値を持てず、リネームにも cwd の追従にも乗らない）。textarea へ直接
      `aria-label` を張る形にした。
      ⚠ **「名前が付いた」だけを見ても足りない**（全ペインに同じ日本語名を付ける実装でも通る）。
      **リネーム後に2枚の名前が別々になること**まで見る。
      ⛔ 区切りにコロンを使わないことも固定している（VoiceOver が「コロン」を発話しうる。
      Issue #149 の design-review で確定した判断）。

  - id: S102
    title: gemini の tmux セッション名が新規起動と履歴 resume で安定する
    spec: S102-gemini-session-id.spec.ts
    readme: false
    note: >-
      Issue #155 / #180 周 6'。gemini にも `--session-id` を渡して、tmux セッション名を
      claude と対称にした。**非対称の全文は `src/main/pty/tmux.ts` 冒頭が唯一の正**
      （ここには書き写さない。書き写すと片方だけ古くなる）。
      見るのは3つ: (1) 新規起動で採番した UUID が `--session-id` に渡り、tmux 名が
      `aiterm-<その UUID>` になる、(2) 履歴 resume で履歴側の内部 UUID から同じ形の名前が
      作られる、(3) CLI が 0.53.0 未満なら `--session-id` を渡さない（縮退）。
      ⭐ **形（`aiterm-<UUID っぽい何か>`）だけを見ない。** それだと ptyId 由来のままでも
      通ってしまい、この Issue の中核（名前がセッションに対して安定か）を1つも見ていない。
      採番された実際の値と**文字列一致**で比べる。
      ⛔ resume の引数が index のままで、UUID を渡していないことも同じ spec で見る
      （数字始まりの UUID は index として解釈され、既存のセッションファイルを失う。
      2026-08-06 実測 / 2回再現）。
      ⚠ **「実際に同じセッションへ戻れた」ことはここでは証明できない**（偽 tmux は
      `-A` の分岐を再現しない。`e2e/fixtures/bin/tmux` が自分でその限界を書いている）。
      証明できるのは「同じ名前が2回作られる」まで。
      2件目のテストは `geminiOldVersion: true` で縮退側を踏む。判定そのものの桁ごとの
      固定は `test/unit/gemini-version.test.ts`。

  - id: S103
    title: CLI が古ければ gemini に --session-id を渡さない
    spec: S103-gemini-session-id-fallback.spec.ts
    readme: false
    note: >-
      Issue #155 / #180 周 6' の**縮退側**（S102 の対）。未知のフラグを渡された gemini は
      `Unknown arguments: …` と usage を出して**即座に終了する**（2026-08-06 実測）。
      tmux でラップされていると利用者からは**「開いた瞬間に終了したペイン」**にしか見えず、
      `describeSpawnError()` は ENOENT しか説明できないので原因に辿り着けない。
      そこで `gemini --version` を1回だけ見て、0.53.0 未満なら `--session-id` を渡さない。
      偽 gemini は `geminiOldVersion: true`（env `AI_TERMINAL_E2E_GEMINI_OLD`）で
      `--version` を 0.52.0 に落とす。
      ⭐ **「渡さない」だけを見ても足りない**（何も起動しない実装でも通る）。
      縮退の結果として **tmux セッション名が ptyId 由来になる**ところまで見る。
      判定そのものの桁ごとの固定は `test/unit/gemini-version.test.ts`
      （⛔ 版が読み取れなければ非対応に倒す、という**外れ方の向き**もそこで固定している）。
